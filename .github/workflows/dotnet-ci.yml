name: .NET CI Pipeline

on:
  push:
    branches: [ "main", "BLogic", "Exception", "Test" ] # Запускати при пуші в будь-яку з цих гілок
  pull_request:
    branches: [ "main", "BLogic", "Exception", "Test" ] # Запускати при створенні Pull Request

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Вказуємо версію .NET, яку ви використовуєте

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal